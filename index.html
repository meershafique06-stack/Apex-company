<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<meta
    name="description"
    content="Apex Company - Connect with us and discover our services."
>

<title>Apex Company | Connect With Us</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<!-- HEADER -->
<header class="site-header">
    <div class="container header-content">

        <a href="index.html" class="logo-link">
            <img
                src="logo.jpeg"
                alt="Apex Company Logo"
                class="logo"
            >
        </a>

        <a href="admin.html" class="admin-access-link">
            Admin Panel
        </a>

    </div>
</header>


<main>

    <!-- SIGNUP SECTION -->
    <section class="signup-section" id="signupSection">

        <div class="signup-card">

            <div class="signup-logo">
                <img
                    src="logo.jpeg"
                    alt="Apex Company Logo"
                >
            </div>

            <h1>Join Apex Company</h1>

            <p class="signup-subtitle">
                Create your account to connect with Apex Company.
            </p>


            <form id="signupForm">

                <div class="input-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>


                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>


                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>


                <button
                    type="submit"
                    id="signupBtn"
                    class="signup-btn"
                >
                    Create Account
                </button>

            </form>


            <p
                id="formMessage"
                class="form-message"
                aria-live="polite"
            ></p>

        </div>

    </section>


    <!-- HERO SECTION -->
    <section
        class="hero-section"
        id="heroSection"
    >

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <p class="hero-small-text">
                WELCOME TO APEX COMPANY
            </p>

            <h2>
                Thank you for connecting
            </h2>

            <p>
                We are excited to have you connected with Apex Company.
            </p>

            <p
                id="userEmail"
                class="connected-email"
            ></p>

            <button
                type="button"
                id="logoutBtn"
                class="hero-btn"
            >
                Logout
            </button>

        </div>

    </section>

</main>


<!-- FOOTER -->
<footer class="site-footer">

    <p>
        © 2026 Apex Company. All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>
```

</body>
</html>
