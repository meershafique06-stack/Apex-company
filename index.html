
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Apex Company - Connect with us using Google"
  >

  <title>Apex Company | Google Login</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <!-- ==============================
       USER PAGE HEADER
  =============================== -->

  <header class="site-header">

    <div class="container header-content">

      <a
        href="index.html"
        class="logo-link"
      >

        <img
          src="logo.jpeg"
          alt="Apex Company Logo"
          class="logo"
        >

      </a>

    </div>

  </header>



  <main>

    <!-- ==============================
         GOOGLE LOGIN
    =============================== -->

    <section
      class="signup-section"
      id="signupSection"
    >

      <div class="signup-card">

        <div class="signup-logo">

          <img
            src="logo.jpeg"
            alt="Apex Company Logo"
          >

        </div>


        <h1>
          Welcome to Apex Company
        </h1>


        <p class="signup-subtitle">
          Sign in securely with your Google account.
        </p>


        <button
          type="button"
          id="googleLoginBtn"
          class="google-login-btn"
        >

          <span class="google-icon">
            G
          </span>

          Continue with Google

        </button>


        <p
          id="formMessage"
          class="form-message"
        ></p>

      </div>

    </section>



    <!-- ==============================
         HERO SECTION
    =============================== -->

    <section
      class="hero-section"
      id="heroSection"
    >

      <div class="hero-overlay"></div>


      <div class="hero-content">

        <p class="hero-small-text">
          WELCOME TO APEX COMPANY
        </p>


        <h2>
          Thank you for connecting
        </h2>


        <p>
          We are excited to have you connected with Apex Company.
        </p>


        <button
          type="button"
          id="googleLogoutBtn"
          class="hero-btn"
        >
          Logout
        </button>

      </div>

    </section>

  </main>



  <!-- ==============================
       FOOTER
  =============================== -->

  <footer class="site-footer">

    <p>
      © 2026 Apex Company. All Rights Reserved.
    </p>

  </footer>



  <!-- ==============================
       USER JAVASCRIPT
  =============================== -->

  <script
    type="module"
    src="script.js"
  ></script>


</body>

</html>
