<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Apex Company Admin Dashboard"
    >

    <title>Apex Company | Admin Portal</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body class="admin-body">

    <!-- ==============================
         ADMIN LOGIN
    =============================== -->
    <section id="adminLoginSection" class="admin-login-section">

        <div class="admin-login-card">

            <div class="admin-logo">
                <img
                    src="./logo.jpeg"
                    alt="Apex Company Logo"
                >
            </div>

            <h1>Admin Portal</h1>

            <p class="admin-subtitle">
                Sign in to access the Apex Company dashboard.
            </p>

            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="adminLoginBtn"
                    class="admin-login-btn"
                >
                    Login to Dashboard
                </button>

            </form>

            <p
                id="adminLoginMessage"
                class="form-message"
                aria-live="polite"
            ></p>

            <a
                href="./index.html"
                class="back-home-link"
            >
                ← Back to Website
            </a>

        </div>

    </section>


    <!-- ==============================
         ADMIN DASHBOARD
    =============================== -->
    <section
        id="adminDashboardSection"
        class="admin-dashboard-section"
        style="display: none;"
    >

        <header class="admin-dashboard-header">

            <div class="admin-header-left">

                <img
                    src="./logo.jpeg"
                    alt="Apex Company Logo"
                    class="admin-header-logo"
                >

                <div>
                    <h1>Admin Dashboard</h1>
                    <p>Apex Company Management Portal</p>
                </div>

            </div>

            <button
                type="button"
                id="adminLogoutBtn"
                class="admin-logout-btn"
            >
                Logout
            </button>

        </header>


        <main class="admin-dashboard-content">

            <!-- Statistics -->
            <div class="admin-stats">

                <div class="admin-stat-card">

                    <span class="admin-stat-label">
                        Total Signups
                    </span>

                    <strong
                        id="totalSignups"
                        class="admin-stat-number"
                    >
                        0
                    </strong>

                </div>


                <div class="admin-stat-card">

                    <span class="admin-stat-label">
                        Latest Signup
                    </span>

                    <strong
                        id="latestSignup"
                        class="admin-stat-text"
                    >
                        No records
                    </strong>

                </div>

            </div>


            <!-- Signup Table -->
            <div class="admin-table-card">

                <div class="admin-table-header">

                    <div>
                        <h2>Signup Records</h2>

                        <p>
                            View users who connected with Apex Company.
                        </p>
                    </div>

                    <button
                        type="button"
                        id="refreshBtn"
                        class="refresh-btn"
                    >
                        Refresh
                    </button>

                </div>


                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Date</th>
                                <th>Time</th>
                            </tr>

                        </thead>

                        <tbody id="signupTableBody">

                            <tr>
                                <td
                                    colspan="5"
                                    class="loading-cell"
                                >
                                    Loading signup records...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

                <p
                    id="dashboardMessage"
                    class="dashboard-message"
                ></p>

            </div>

        </main>

    </section>


    <script
        type="module"
        src="./admin.js"
    ></script>

</body>
</html>
